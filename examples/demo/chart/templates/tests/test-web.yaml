apiVersion: v1
kind: Pod
metadata:
  name: {{ include "demo.fullname" . }}-test
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: {{ .Values.image }}
      command: ["wget", "-qO-", "http://{{ include "demo.fullname" . }}:8080/"]
