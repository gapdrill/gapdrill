apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 60
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: docker.io/library/busybox:1.37.0
          imagePullPolicy: Always
          command: ["sh", "-ec", 'test "$(cat /state/schema)" = v2']
          volumeMounts:
            - name: state
              mountPath: /state
              readOnly: true
      volumes:
        - name: state
          configMap:
            name: {{ .Release.Name }}-state
